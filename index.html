<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Chance to Return Not Found</title>
    <!-- Font Pixel Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: #f7f7f7;
            color: #535353;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            min-height: 100dvh; /* Pas di browser HP modern */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 16px;
            transition: background-color 0.2s;
        }

        /* Flex Container Utama agar pas di Laptop & HP */
        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(20px, 4vh, 36px);
        }

        /* Area Game / Animasi Dino Versi Patah Hati */
        .game-area {
            position: relative;
            width: 100%;
            height: clamp(140px, 24vh, 180px);
            border-bottom: 2px solid #535353;
            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Header Game (Hint & Scoreboard dengan Flexbox) */
        .game-header {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }

        .hint {
            font-size: clamp(7px, 1.8vw, 10px);
            color: #9e9e9e;
        }

        .scoreboard {
            font-size: clamp(9px, 2.2vw, 12px);
            letter-spacing: 1px;
            color: #535353;
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .hi-score {
            color: #8b8b8b;
        }

        /* Awan bergerak */
        .cloud {
            position: absolute;
            top: 40px;
            right: -60px;
            width: 46px;
            height: 14px;
            background: #e0e0e0;
            border-radius: 10px;
            animation: moveCloud 8s linear infinite;
        }
        .cloud::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 10px;
            width: 22px;
            height: 16px;
            background: #e0e0e0;
            border-radius: 50%;
        }

        /* Karakter Utama: Hati yang Patah */
        .heart-player {
            position: absolute;
            bottom: 0;
            left: clamp(20px, 6vw, 45px);
            width: clamp(36px, 8vw, 44px);
            height: clamp(36px, 8vw, 44px);
            z-index: 5;
        }

        .heart-player svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Transisi belahan hati saat mati */
        .heart-left, .heart-right, .leg-left, .leg-right {
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dead-eyes {
            opacity: 0;
        }

        /* Animasi Melompat */
        .jump {
            animation: jumpAnim 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes jumpAnim {
            0% { bottom: 0; }
            50% { bottom: 85px; }
            100% { bottom: 0; }
        }

        /* Animasi Kaki Berlari */
        .running .leg-left {
            animation: runLeg 0.15s infinite alternate;
        }
        .running .leg-right {
            animation: runLeg 0.15s infinite alternate-reverse;
        }

        @keyframes runLeg {
            from { transform: translateY(0); }
            to { transform: translateY(-2px); }
        }

        /* ====== ANIMASI MATI KETIKA NABRAK ====== */
        .heart-player.dead {
            animation: deathShake 0.4s ease forwards;
        }

        /* Belahan hati terpisah dan jatuh miring */
        .heart-player.dead .heart-left {
            transform: translate(-3px, 2px) rotate(-18deg);
            transform-origin: bottom right;
            fill: #b51724;
        }

        .heart-player.dead .heart-right {
            transform: translate(3px, 2px) rotate(18deg);
            transform-origin: bottom left;
            fill: #b51724;
        }

        /* Muncul mata X X */
        .heart-player.dead .dead-eyes {
            opacity: 1;
        }

        /* Kaki berhenti dan terlipat */
        .heart-player.dead .leg-left,
        .heart-player.dead .leg-right {
            animation: none;
            transform: translateY(2px);
        }

        @keyframes deathShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5px, -6px); }
            40% { transform: translate(5px, -3px); }
            60% { transform: translate(-3px, 0); }
            80% { transform: translate(3px, 0); }
            100% { transform: translate(0, 2px); }
        }

        /* Rintangan (Batu Nisan Kenangan - Tetap terlihat di layar) */
        .obstacle {
            position: absolute;
            bottom: 0;
            right: 20px;
            width: clamp(22px, 5vw, 26px);
            height: clamp(30px, 7vw, 36px);
            animation: moveObstacle 2s linear infinite;
        }

        @keyframes moveObstacle {
            0% { right: 20px; }
            100% { right: 100%; }
        }

        @keyframes moveCloud {
            0% { right: -60px; }
            100% { right: 105%; }
        }

        /* Pause semua animasi ketika belum mulai atau tertabrak (Game Over) */
        .game-area.paused .obstacle,
        .game-area.paused .cloud,
        .game-area.paused .heart-player.jump {
            animation-play-state: paused !important;
        }

        /* Layar Game Over di tengah area game */
        .game-over-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(247, 247, 247, 0.65);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 20;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-text {
            font-size: clamp(12px, 3.5vw, 16px);
            color: #535353;
            letter-spacing: 3px;
        }

        .game-over-score {
            font-size: clamp(9px, 2.5vw, 11px);
            color: #7a7a7a;
            letter-spacing: 1px;
        }

        .restart-icon {
            width: 34px;
            height: 30px;
            background: #535353;
            color: #f7f7f7;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #bdbdbd;
        }

        .restart-icon:hover {
            background: #e63946;
        }

        /* Bagian Teks 404 di Tengah (Flexbox) */
        .error-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: clamp(10px, 2vh, 16px);
            padding: 0 10px;
            width: 100%;
        }

        .error-code {
            font-size: clamp(38px, 10vw, 60px);
            color: #535353;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0px #e0e0e0;
        }

        .error-title {
            font-size: clamp(11px, 3vw, 16px);
            line-height: 1.6;
            color: #535353;
            text-transform: uppercase;
            max-width: 95%;
        }

        .error-desc {
            font-family: 'VT323', monospace;
            font-size: clamp(18px, 4.5vw, 24px);
            color: #7a7a7a;
            max-width: 500px;
            line-height: 1.3;
        }

        /* Tombol Move On */
        .btn-moveon {
            margin-top: 6px;
            background-color: #535353;
            color: #f7f7f7;
            border: none;
            padding: clamp(10px, 2.5vw, 14px) clamp(18px, 4vw, 26px);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(9px, 2.5vw, 11px);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 4px 4px 0px #bdbdbd;
        }

        .btn-moveon:hover {
            background-color: #e63946;
            color: #fff;
        }

        .btn-moveon:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #bdbdbd;
        }

        /* Efek Flash Merah saat tertabrak */
        .hit-flash {
            animation: flashRed 0.35s ease;
        }

        @keyframes flashRed {
            0%, 100% { background-color: #f7f7f7; }
            50% { background-color: #ffd6da; }
        }

        /* Penyesuaian khusus layar HP kecil atau mode landscape pendek */
        @media (max-height: 520px) {
            .container {
                gap: 12px;
            }
            .game-area {
                height: 115px;
            }
            .error-code {
                font-size: 30px;
            }
            .error-desc {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Area Dino Game Versi Patah Hati (Di Atas) - Paused di awal sebelum di-klik -->
        <div class="game-area paused" id="gameArea">
            <div class="game-header">
                <div class="hint">TAP / SPACE TO JUMP</div>
                <!-- Dino Score versi Patah Hati -->
                <div class="scoreboard">
                    <span class="hi-score">HI <span id="hiScore">00404</span></span>
                    <span>TEARS <span id="currentScore">00000</span></span>
                </div>
            </div>

            <!-- Awan -->
            <div class="cloud"></div>

            <!-- Karakter: Pixel Patah Hati dengan Animasi Mati (SVG) -->
            <div class="heart-player" id="player">
                <svg viewBox="0 0 16 16">
                    <!-- Belahan Hati Kiri -->
                    <g class="heart-left">
                        <path fill="#e63946" d="M2,4 h3 v1 h1 v1 h-1 v1 h-1 v2 h1 v1 h1 v1 h1 v2 h-1 v1 h-1 v-1 h-1 v-1 h-1 v-1 h-1 v-2 h-1 v-3 h1 v-1 z"/>
                        <!-- Mata X Kiri (Muncul saat nabrak) -->
                        <path class="dead-eyes" fill="#ffffff" d="M2,6 h1 v1 h-1 z M4,6 h1 v1 h-1 z M3,7 h1 v1 h-1 z M2,8 h1 v1 h-1 z M4,8 h1 v1 h-1 z"/>
                    </g>
                    <!-- Belahan Hati Kanan -->
                    <g class="heart-right">
                        <path fill="#e63946" d="M11,4 h3 v1 h1 v3 h-1 v2 h-1 v1 h-1 v1 h-1 v1 h-1 v-2 h1 v-1 h1 v-1 h-1 v-2 h1 v-1 h1 v-1 z"/>
                        <!-- Mata X Kanan (Muncul saat nabrak) -->
                        <path class="dead-eyes" fill="#ffffff" d="M11,6 h1 v1 h-1 z M13,6 h1 v1 h-1 z M12,7 h1 v1 h-1 z M11,8 h1 v1 h-1 z M13,8 h1 v1 h-1 z"/>
                    </g>
                    <!-- Kaki kecil ala Dino -->
                    <rect class="leg-left" x="4" y="14" width="2" height="2" fill="#535353"/>
                    <rect class="leg-right" x="10" y="14" width="2" height="2" fill="#535353"/>
                </svg>
            </div>

            <!-- Rintangan: Batu Nisan Kenangan (SVG) -->
            <div class="obstacle" id="obstacle">
                <svg viewBox="0 0 12 16" width="100%" height="100%">
                    <path fill="#535353" d="M3,2 h6 v1 h1 v1 h1 v10 h1 v2 h-12 v-2 h1 v-10 h1 v-1 h1 z"/>
                    <rect x="5" y="5" width="2" height="6" fill="#f7f7f7"/>
                    <rect x="4" y="6" width="4" height="2" fill="#f7f7f7"/>
                </svg>
            </div>

            <!-- Overlay saat Mati / Nabrak -->
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-text">HEARTBROKEN</div>
                <div class="game-over-score">SCORE: <span id="finalScore">00000</span></div>
                <div class="restart-icon" title="Main Lagi">&#8635;</div>
            </div>
        </div>

        <!-- Teks 404 di Tengah-Tengah -->
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Chance to Return Not Found</h2>
            <p class="error-desc">Halaman, perasaan, atau kesempatan untuk kembali sudah tidak ditemukan.</p>
            <button class="btn-moveon" onclick="this.blur(); restartGame();">COBA MOVE ON</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const obstacle = document.getElementById('obstacle');
        const scoreElement = document.getElementById('currentScore');
        const hiScoreElement = document.getElementById('hiScore');
        const finalScoreElement = document.getElementById('finalScore');
        const gameArea = document.getElementById('gameArea');
        const gameOverOverlay = document.getElementById('gameOverOverlay');

        let score = 0;
        let hiScore = 404;
        let isDead = false;
        let isStarted = false;
        let jumpTimer = null;

        // Fungsi memicu animasi loncat
        function doJump() {
            if (!player.classList.contains('jump')) {
                player.classList.add('jump');
                clearTimeout(jumpTimer);
                jumpTimer = setTimeout(() => {
                    if (!isDead) {
                        player.classList.remove('jump');
                    }
                }, 550);
            }
        }

        // Fungsi Melompat & Memulai Game
        function jump() {
            if (!isStarted) {
                restartGame();
                return;
            }
            if (isDead) {
                restartGame();
                return;
            }
            doJump();
        }

        // Fungsi Mati ketika Menabrak
        function triggerDeath() {
            isDead = true;
            clearTimeout(jumpTimer);
            gameArea.classList.add('paused');
            player.classList.remove('running');
            player.classList.add('dead');
            finalScoreElement.innerText = String(score).padStart(5, '0');
            gameOverOverlay.classList.add('show');

            document.body.classList.add('hit-flash');
            setTimeout(() => document.body.classList.remove('hit-flash'), 350);
        }

        // Fungsi Mulai / Mulai Ulang (Spasi atau Tombol Coba Move On)
        function restartGame() {
            if (!isStarted || isDead) {
                isStarted = true;
                isDead = false;
                score = 0;
                scoreElement.innerText = "00000";

                clearTimeout(jumpTimer);
                player.classList.remove('dead', 'jump');
                void player.offsetWidth; /* Memicu reflow agar siap loncat */
                player.classList.add('running');
                gameArea.classList.remove('paused');
                gameOverOverlay.classList.remove('show');

                // Reset posisi batu nisan ke kanan layar hanya saat mulai ulang dari mati
                obstacle.style.animation = 'none';
                obstacle.offsetHeight; /* Memicu reflow browser */
                obstacle.style.animation = null;
            }

            // Langsung loncat tanpa menghilangkan batu nisan yang sedang berjalan
            doJump();
        }

        // Kontrol Keyboard (Laptop/PC)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        // Kontrol Sentuh / Klik (HP & Mouse)
        gameArea.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            jump();
        });

        // Menjalankan Skor selama sudah dimulai dan masih hidup
        setInterval(() => {
            if (isStarted && !isDead) {
                score++;
                scoreElement.innerText = String(score).padStart(5, '0');

                if (score > hiScore) {
                    hiScore = score;
                    hiScoreElement.innerText = String(hiScore).padStart(5, '0');
                }
            }
        }, 100);

        // Deteksi Tabrakan yang Akurat di Semua Ukuran Layar (Laptop & HP)
        setInterval(() => {
            if (!isStarted || isDead) return;

            const playerRect = player.getBoundingClientRect();
            const obstacleRect = obstacle.getBoundingClientRect();

            // Padding hitbox agar deteksi tabrakan terasa pas dan adil
            const hitPadding = 7;

            const isColliding = !(
                playerRect.right - hitPadding < obstacleRect.left + hitPadding ||
                playerRect.left + hitPadding > obstacleRect.right - hitPadding ||
                playerRect.bottom - hitPadding < obstacleRect.top + hitPadding ||
                playerRect.top + hitPadding > obstacleRect.bottom - hitPadding
            );

            if (isColliding) {
                triggerDeath();
            }
        }, 20);
    </script>

</body>
</html>
